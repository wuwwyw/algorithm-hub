<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>服务器错误 · Algorithm Hub</title>
    <link rel="stylesheet" href="/css/500.css">
</head>
<body>

<header class="topbar">
    <a class="brand" href="/">
        <span class="brand-symbol"><span>A</span></span>
        <span>Algorithm Hub</span>
    </a>

    <a class="home-link" href="/">返回模板库</a>
</header>

<main class="error-main">
    <section class="error-card">
        <div class="error-code">500</div>
        <h1>服务器暂时没有响应</h1>
        <p>
            当前请求没有完成，请稍后重新尝试。
            你的模板数据不会因为这个问题丢失。
        </p>
        <a class="primary-btn" href="/">返回模板库</a>
    </section>
</main>

</body>
</html>
